[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cesl-core"
version = "0.1.0"
description = "Research implementation of Counterfactual Evidence Sufficiency Learning"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "Pillow>=10.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "torch>=2.3",
    "torchvision>=0.18",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
