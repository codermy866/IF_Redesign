[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "if-redesign-sma"
version = "0.1.0"
description = "Supervision-matched adaptation for cervical OCT vision-language models"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "peft>=0.17",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.2",
  "transformers>=4.57",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
derive-sma-allocation = "if_redesign.cli_allocation:main"
train-sma = "if_redesign.train:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
