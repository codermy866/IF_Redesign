[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "if-redesign"
version = "0.6.0"
description = "Frozen JEV replication-invariant evidence measures and source-only multimodal risk readouts"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=8"]
visual = ["Pillow>=10", "transformers>=4.57", "peft>=0.17"]
jev27b = [
  "Pillow>=10", "torch==2.6.0", "torchvision==0.21.0",
  "transformers==5.19.0", "peft==0.21.2", "bitsandbytes==0.50.2",
  "safetensors>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
