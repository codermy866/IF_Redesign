[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "if-redesign"
version = "0.4.0"
description = "CFV-JEV fixed-slot interventions and source-only evidence correction"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
test = ["pytest>=8"]
visual = ["Pillow>=10", "transformers>=4.57", "peft>=0.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
